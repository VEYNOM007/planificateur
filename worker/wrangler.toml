name = "planificateur-rappels"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Chaque installation possède un jeton secret généré sur le téléphone.
# Le service ne stocke que l'abonnement push, chiffré par le navigateur :
# heure + titre envoyés, rien d'autre.
[[kv_namespaces]]
binding = "REMINDERS"
id = "5f84f213166b4b64a4d9758e4199da6d"

# Rien de secret dans ce fichier (R5) :
#   npx wrangler secret put VAPID_PUBLIC_KEY
#   npx wrangler secret put VAPID_PRIVATE_KEY
#   npx wrangler secret put VAPID_SUBJECT   (ex. https://github.com/VEYNOM007/planificateur)
[vars]
ENVIRONMENT = "production"
