<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1d27" />
    <title>Test Web Push — Planificateur</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #12141c;
        color: #e8eaf0;
        margin: 0;
        padding: 24px;
        line-height: 1.5;
      }
      h1 {
        font-size: 1.2rem;
      }
      label {
        display: block;
        margin-top: 16px;
        font-size: 0.85rem;
        color: #9aa1b2;
      }
      input {
        width: 100%;
        padding: 12px;
        margin-top: 4px;
        border-radius: 10px;
        border: 1px solid #2e3342;
        background: #1a1d27;
        color: inherit;
        font-size: 1rem;
      }
      button {
        width: 100%;
        min-height: 48px;
        margin-top: 16px;
        border: none;
        border-radius: 10px;
        background: #60a5fa;
        color: #0b1020;
        font-size: 1rem;
        font-weight: 600;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #1a1d27;
        border: 1px solid #2e3342;
        border-radius: 10px;
        padding: 12px;
        font-size: 0.8rem;
        min-height: 120px;
      }
    </style>
  </head>
  <body>
    <h1>Test Web Push — Planificateur</h1>
    <p>
      Page temporaire : elle vérifie qu'une notification arrive, application fermée, sur ce
      téléphone. À supprimer au jalon J7.
    </p>

    <label for="worker">Adresse du service de rappels (worker)</label>
    <input id="worker" placeholder="https://planificateur-rappels.<compte>.workers.dev" />

    <label for="delay">Délai avant envoi (secondes, 0 à 25)</label>
    <input id="delay" type="number" min="0" max="25" step="1" value="15" />

    <button id="enable" type="button">1. Activer les notifications</button>
    <button id="send" type="button" disabled>2. Envoyer une notification de test</button>

    <label>Journal</label>
    <pre id="log">Prêt.</pre>

    <script type="module">
      const TOKEN_KEY = 'planificateur:installation-token';
      const log = (message) => {
        document.getElementById('log').textContent += `\n${message}`;
      };
      const workerInput = document.getElementById('worker');
      workerInput.value = localStorage.getItem('planificateur:worker-url') ?? '';
      const delayInput = document.getElementById('delay');

      function installationToken() {
        let token = localStorage.getItem(TOKEN_KEY);
        if (!token || token.length !== 64) {
          const bytes = new Uint8Array(32);
          crypto.getRandomValues(bytes);
          token = Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
          localStorage.setItem(TOKEN_KEY, token);
        }
        return token;
      }

      function base64ToUint8Array(base64) {
        const padding = '='.repeat((4 - (base64.length % 4)) % 4);
        const raw = atob((base64 + padding).replace(/-/g, '+').replace(/_/g, '/'));
        return Uint8Array.from(raw, (c) => c.charCodeAt(0));
      }

      function workerUrl() {
        const value = workerInput.value.trim().replace(/\/$/, '');
        localStorage.setItem('planificateur:worker-url', value);
        return value;
      }

      document.getElementById('enable').addEventListener('click', async () => {
        try {
          if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
            log('Web Push non supporté par ce navigateur.');
            return;
          }
          const registration = await navigator.serviceWorker.register('push-test-sw.js', {
            scope: './',
          });
          const permission = await Notification.requestPermission();
          if (permission !== 'granted') {
            log('Permission refusée.');
            return;
          }
          const response = await fetch(`${workerUrl()}/v1/vapid-public-key`);
          const { publicKey } = await response.json();
          const subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: base64ToUint8Array(publicKey),
          });
          const saved = await fetch(`${workerUrl()}/v1/subscribe`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              ...subscription.toJSON(),
              installationToken: installationToken(),
            }),
          });
          if (!saved.ok) {
            log(`Échec de l'enregistrement (${saved.status}).`);
            return;
          }
          document.getElementById('send').disabled = false;
          log('Abonnement enregistré. Tu peux fermer l’application puis envoyer un test.');
        } catch (error) {
          log(`Erreur : ${error instanceof Error ? error.message : String(error)}`);
        }
      });

      document.getElementById('send').addEventListener('click', async () => {
        try {
          const delaySeconds = Math.min(25, Math.max(0, Number(delayInput.value) || 0));
          const response = await fetch(`${workerUrl()}/v1/test-push`, {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-installation-token': installationToken(),
            },
            body: JSON.stringify({
              title: 'Planificateur',
              body: 'Notification de test reçue.',
              delaySeconds,
            }),
          });
          const body = await response.json();
          log(`Réponse du service : ${response.status} ${JSON.stringify(body)}`);
          if (body.scheduled) {
            log(
              `Notification programmée dans ${delaySeconds} s : ferme l'application maintenant, ` +
                'puis attends la notification.',
            );
          }
        } catch (error) {
          log(`Erreur : ${error instanceof Error ? error.message : String(error)}`);
        }
      });
    </script>
  </body>
</html>
