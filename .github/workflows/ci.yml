name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  application:
    name: Application (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Tests unitaires et couverture du domaine
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Poids initial gzip (< 200 ko)
        run: npm run size

  worker:
    name: Service de rappels (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
